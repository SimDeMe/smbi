<svg xmlns="http://www.w3.org/2000/svg" width="480" height="500" viewBox="0 0 240 250">
  <!-- SM-Simon i kittel, set forfra fra livet og op. Lav og bred.
       Halsen (hovedets anker) er (120, 18). Hoejre skulder, hvor armen
       drejer, er (198, 62). Den venstre arm haenger ned langs siden. -->
  <defs>
    <linearGradient id="kittel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d2da"/>
      <stop offset="0.3" stop-color="#f7f9fb"/>
      <stop offset="0.7" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#bcc6cf"/>
    </linearGradient>
    <linearGradient id="hud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a37f"/>
      <stop offset="0.5" stop-color="#f1c7a3"/>
      <stop offset="1" stop-color="#d49c77"/>
    </linearGradient>
  </defs>
  <!-- Hals -->
  <rect x="102" y="6" width="36" height="32" rx="10" fill="url(#hud)"/>
  <!-- T-shirt -->
  <path d="M86 32 Q120 50 154 32 L158 130 L82 130 Z" fill="#2f5d46"/>
  <path d="M96 34 Q120 50 144 34" fill="none" stroke="#244a37" stroke-width="3"/>
  <text x="120" y="84" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#cfe6d8" letter-spacing="1">smbi</text>
  <!-- Kittel -->
  <path d="M88 28 Q48 30 28 50 Q10 66 8 112 L4 250 L236 250 L232 112 Q230 66 212 50 Q192 30 152 28 L140 130 L120 250 L100 130 Z" fill="url(#kittel)" stroke="#9aa6b1" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Revers -->
  <path d="M88 28 L100 130 L70 72 L86 62 Z" fill="#e3e9ee" stroke="#9aa6b1" stroke-width="1"/>
  <path d="M152 28 L140 130 L170 72 L154 62 Z" fill="#e3e9ee" stroke="#9aa6b1" stroke-width="1"/>
  <!-- Venstre aerme og haand -->
  <path d="M28 50 Q8 64 6 112 L2 204 L42 206 L50 114 Q52 80 60 60 Z" fill="url(#kittel)" stroke="#9aa6b1" stroke-width="1.2"/>
  <path d="M2 198 L42 200" stroke="#9aa6b1" stroke-width="1.2"/>
  <ellipse cx="22" cy="220" rx="18" ry="18" fill="url(#hud)"/>
  <!-- Brystlomme med blyant og lup -->
  <path d="M166 100 L206 100 L204 138 L168 138 Z" fill="none" stroke="#9aa6b1" stroke-width="1.2"/>
  <rect x="174" y="84" width="4" height="20" rx="1" fill="#e0a83a"/>
  <path d="M174 84 L176 79 L178 84 Z" fill="#3a3f47"/>
  <circle cx="192" cy="92" r="7" fill="#d4ebfa" fill-opacity="0.5" stroke="#2b2f36" stroke-width="2"/>
  <rect x="190.5" y="98" width="3" height="8" rx="1" fill="#2b2f36"/>
  <!-- Navneskilt: SIMON. "SM-" er skrevet foran med kuglepen af en elev -->
  <rect x="26" y="92" width="62" height="19" rx="3" fill="#ffffff" stroke="#6f7a85" stroke-width="1"/>
  <text x="62" y="105.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.6" font-weight="800" fill="#2a3038">SIMON</text>
  <text x="29" y="106.5" font-family="Segoe Print, Comic Sans MS, cursive" font-size="8" font-weight="700" fill="#2d62b3" transform="rotate(-10 34 102)">SM-</text>
  <!-- Knapper -->
  <circle cx="122" cy="150" r="2.6" fill="#c3ccd4"/>
  <circle cx="121" cy="190" r="2.6" fill="#c3ccd4"/>
  <circle cx="120" cy="230" r="2.6" fill="#c3ccd4"/>
</svg>
