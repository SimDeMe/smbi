<svg xmlns="http://www.w3.org/2000/svg" width="88" height="112" viewBox="0 0 44 56">
  <!-- Kemi-Nillers kaffekop: en papkop med laag. Bunden (ankeret) er
       (22, 56). Aabningen i laaget er (22, 6). -->
  <defs>
    <linearGradient id="pap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dde2"/>
      <stop offset="0.4" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#c6ccd3"/>
    </linearGradient>
  </defs>
  <!-- Koppen -->
  <path d="M8 12 L12 52 Q12 56 16 56 L28 56 Q32 56 32 52 L36 12 Z" fill="url(#pap)" stroke="#9aa6b1" stroke-width="1"/>
  <!-- Manchet med formel -->
  <path d="M9.6 26 L34.4 26 L32.9 42 L11.1 42 Z" fill="#8a5a32"/>
  <text x="22" y="37" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="800" fill="#f7efe2">KEMI</text>
  <!-- Laag -->
  <rect x="5" y="6" width="34" height="8" rx="3" fill="#3a4049" stroke="#23272e" stroke-width="1"/>
  <ellipse cx="22" cy="6" rx="17" ry="3.4" fill="#4a515b" stroke="#23272e" stroke-width="1"/>
  <ellipse cx="22" cy="6" rx="5" ry="1.8" fill="#1b1f25"/>
  <rect x="10" y="16" width="2.5" height="32" rx="1.2" fill="#ffffff" fill-opacity="0.35"/>
</svg>
