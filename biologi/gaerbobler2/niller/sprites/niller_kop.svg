<svg xmlns="http://www.w3.org/2000/svg" width="92" height="96" viewBox="0 0 46 48">
  <!-- Kemi-Nillers kop: en almindelig kop med kemisymboler paa.
       Bunden (ankeret) er (23, 48). -->
  <defs>
    <linearGradient id="porcelaen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd8e0"/>
      <stop offset="0.35" stop-color="#fbfdfe"/>
      <stop offset="1" stop-color="#c2ccd6"/>
    </linearGradient>
  </defs>
  <!-- Hank -->
  <path d="M33 18 Q43 18 43 26 Q43 34 33 34" fill="none" stroke="#dde5ec" stroke-width="4"/>
  <path d="M33 18 Q43 18 43 26 Q43 34 33 34" fill="none" stroke="#9aa6b1" stroke-width="1"/>
  <!-- Selve koppen -->
  <path d="M5 10 L7 44 Q7.5 48 11 48 L29 48 Q32.5 48 33 44 L35 10 Z" fill="url(#porcelaen)" stroke="#9aa6b1" stroke-width="1"/>
  <!-- Kaffen -->
  <ellipse cx="20" cy="10" rx="15" ry="3.6" fill="#4a2c18" stroke="#9aa6b1" stroke-width="1"/>
  <ellipse cx="17" cy="9.6" rx="5" ry="1.4" fill="#6b4226" fill-opacity="0.8"/>
  <!-- Kemisymboler: benzenring og H2O -->
  <g stroke="#2f6fae" stroke-width="1.4" fill="none">
    <path d="M10 26 L13 21.5 L18.5 21.5 L21.5 26 L18.5 30.5 L13 30.5 Z"/>
    <circle cx="15.7" cy="26" r="2.6" stroke-width="1"/>
  </g>
  <text x="26.5" y="28.5" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" font-weight="800" fill="#2f6fae">H</text>
  <text x="31.5" y="30.5" font-family="Segoe UI, Arial, sans-serif" font-size="5.5" font-weight="800" fill="#2f6fae">2</text>
  <text x="26" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" font-weight="800" fill="#2f6fae">O</text>
  <text x="9" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="6.5" font-weight="800" fill="#c0392b">pH</text>
  <!-- Genskin -->
  <rect x="8.5" y="14" width="2" height="26" rx="1" fill="#ffffff" fill-opacity="0.55"/>
