<svg xmlns="http://www.w3.org/2000/svg" width="440" height="500" viewBox="0 0 220 250">
  <!-- Kemi-Niller i kittel, set forfra fra livet og op. Hoej og slank.
       Halsen (hovedets anker) er (110, 18). Hoejre skulder, hvor armen
       drejer, er (176, 58). -->
  <defs>
    <linearGradient id="kittel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d2da"/>
      <stop offset="0.3" stop-color="#f7f9fb"/>
      <stop offset="0.7" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#bcc6cf"/>
    </linearGradient>
    <linearGradient id="hud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a37f"/>
      <stop offset="0.5" stop-color="#f1c7a3"/>
      <stop offset="1" stop-color="#d49c77"/>
    </linearGradient>
  </defs>
  <!-- Hals -->
  <rect x="98" y="6" width="24" height="34" rx="7" fill="url(#hud)"/>
  <!-- Skjorte -->
  <path d="M86 32 L110 56 L134 32 L136 126 L84 126 Z" fill="#6fa8dc"/>
  <path d="M94 34 L110 50 L126 34" fill="none" stroke="#4a86b8" stroke-width="3"/>
  <!-- Kittel -->
  <path d="M86 28 Q54 30 38 48 Q22 64 20 108 L16 250 L204 250 L200 108 Q198 64 182 48 Q166 30 134 28 L124 126 L110 250 L96 126 Z" fill="url(#kittel)" stroke="#9aa6b1" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M86 28 L96 126 L72 70 L86 60 Z" fill="#e3e9ee" stroke="#9aa6b1" stroke-width="1"/>
  <path d="M134 28 L124 126 L148 70 L134 60 Z" fill="#e3e9ee" stroke="#9aa6b1" stroke-width="1"/>
  <!-- Venstre aerme og haand -->
  <path d="M38 48 Q20 62 18 108 L14 202 L46 204 L52 110 Q54 78 60 58 Z" fill="url(#kittel)" stroke="#9aa6b1" stroke-width="1.2"/>
  <path d="M14 196 L46 198" stroke="#9aa6b1" stroke-width="1.2"/>
  <ellipse cx="30" cy="218" rx="15" ry="17" fill="url(#hud)"/>
  <!-- Brystlomme med kuglepenne og et reagensglas -->
  <path d="M148 94 L184 94 L182 130 L150 130 Z" fill="none" stroke="#9aa6b1" stroke-width="1.2"/>
  <rect x="154" y="80" width="4" height="18" rx="1" fill="#2d62b3"/>
  <rect x="161" y="82" width="4" height="16" rx="1" fill="#c0392b"/>
  <rect x="169" y="76" width="9" height="24" rx="3" fill="#d4ebfa" fill-opacity="0.75" stroke="#8fb6cc" stroke-width="1"/>
  <rect x="170.5" y="88" width="6" height="11" rx="2" fill="#4a86b8" fill-opacity="0.8"/>
  <!-- Navneskilt: NIELS. "KEMI-" er skrevet foran med kuglepen af en elev -->
  <rect x="32" y="90" width="62" height="19" rx="3" fill="#ffffff" stroke="#6f7a85" stroke-width="1"/>
  <text x="70" y="103.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.6" font-weight="800" fill="#2a3038">NIELS</text>
  <text x="34" y="104.5" font-family="Segoe Print, Comic Sans MS, cursive" font-size="7.4" font-weight="700" fill="#2d62b3" transform="rotate(-9 39 100)">KEMI-</text>
  <!-- Knapper -->
  <circle cx="112" cy="150" r="2.6" fill="#c3ccd4"/>
  <circle cx="111" cy="190" r="2.6" fill="#c3ccd4"/>
  <circle cx="110" cy="230" r="2.6" fill="#c3ccd4"/>
</svg>
