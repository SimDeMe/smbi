<svg xmlns="http://www.w3.org/2000/svg" width="68" height="140" viewBox="0 0 34 70">
  <!-- Draabeflaske med bromthymolblaat. Spidsen er (17, 2). Bunden er
       (17, 70). -->
  <defs>
    <linearGradient id="flaske" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c4f9c"/>
      <stop offset="0.45" stop-color="#3478d0"/>
      <stop offset="1" stop-color="#173f80"/>
    </linearGradient>
  </defs>
  <!-- Spidsen og haetten -->
  <path d="M15.5 2 L18.5 2 L22 16 L12 16 Z" fill="#f3f5f7" stroke="#aeb7c0" stroke-width="0.8"/>
  <rect x="9" y="15" width="16" height="9" rx="2" fill="#e9edf1" stroke="#aeb7c0" stroke-width="0.8"/>
  <path d="M11 18 h12 M11 21 h12" stroke="#c3cbd3" stroke-width="0.7"/>
  <!-- Flasken -->
  <rect x="3" y="23" width="28" height="47" rx="6" fill="url(#flaske)" stroke="#0f2c5c" stroke-width="1"/>
  <rect x="6" y="27" width="3" height="36" rx="1.5" fill="#ffffff" fill-opacity="0.22"/>
  <!-- Etiket -->
  <rect x="6" y="38" width="22" height="18" rx="2" fill="#f7f5ee"/>
  <text x="17" y="50.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="800" fill="#1f3f78">BTB</text>
</svg>
