<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global cirkulation — smbi.dk</title>
  <meta name="description" content="Interaktiv 3-cellemodel: passat, vestenvind, ITK, Corioliseffekten og monsun på en globus, der kan drejes, med et snit fra pol til pol.">
  <meta name="theme-color" content="#FFF9EE">
  <link rel="canonical" href="https://smbi.dk/atlas/cirkulation/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../vendor/fonts/fonts.css">
  <link rel="stylesheet" href="cirkulation.css">
  <script defer src="../vendor/d3-array.min.js"></script>
  <script defer src="../vendor/d3-geo.min.js"></script>
  <script defer src="../vendor/topojson-client.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="spring" href="#globus">Spring til globussen</a>
  <header class="site-header">
    <div class="regnbue"></div>
    <div class="site-linje">
      <div class="identitet">
        <a class="brand" href="/" aria-label="smbi.dk — forside"><span aria-hidden="true"></span>smbi<small>.dk</small></a>
        <h1>Global cirkulation</h1>
      </div>
      <a href="/atlas/">← Atlas</a>
    </div>
  </header>

  <main class="lab">
    <div class="visninger">
      <section class="globusfelt" aria-label="Globus med vind ved jorden">
        <div class="overskrift">
          <p class="aflaesning" id="aflaesning"><span id="globushjaelp">Peg på globussen for at aflæse vinden · træk for at dreje</span></p>
          <span class="maerkat">Model · ikke målfast</span>
        </div>
        <canvas id="globus" tabindex="0" aria-describedby="globushjaelp"
          aria-label="Globus med vindpartikler. Træk eller brug piletasterne for at dreje. Enter slipper en ballon midt på globussen, når ballonen er valgt."></canvas>
        <div class="signatur" aria-label="Signatur">
          <span><i style="--f:#7ce1c1"></i>Passat</span>
          <span><i style="--f:#f0b97a"></i>Vestenvind</span>
          <span><i style="--f:#a9bdeb"></i>Polar østenvind</span>
          <span><i style="--f:#f497c4"></i>Monsun</span>
          <span><i style="--f:#f6d977"></i>ITK / regnbælte</span>
        </div>
        <p class="ballontip" id="ballontip" hidden>Klik på globussen for at slippe en ballon</p>
        <p class="fejl" id="fejl" role="status" hidden></p>
      </section>

      <aside class="side">
        <section class="snitfelt" aria-labelledby="snit-titel">
          <div class="overskrift lys"><h2 id="snit-titel">Luftens kredsløb</h2><span>Syd → nord</span></div>
          <canvas id="snit" role="img" aria-label="Snit gennem atmosfæren fra Sydpol til Nordpol. Luften stiger ved ITK og ved 60° og synker ved 30° og ved polerne: Hadley-, Ferrel- og polarcellen på hver halvkugle."></canvas>
        </section>
        <section class="historie" aria-labelledby="trin-titel" aria-live="polite">
          <div class="trinhoved">
            <span id="trin-nr">1 / 5</span>
            <div class="prikker" id="prikker"></div>
            <div class="pile">
              <button id="forrige" aria-label="Forrige trin">←</button>
              <button id="naeste" aria-label="Næste trin">→</button>
            </div>
          </div>
          <h2 id="trin-titel"></h2>
          <p id="trin-tekst"></p>
          <p class="proev"><b>Prøv:</b> <span id="trin-proev"></span></p>
        </section>
      </aside>
    </div>

    <div class="betjening">
      <div class="aarslinje">
        <button id="afspil" class="afspil" aria-pressed="false">▶ <span>Afspil år</span></button>
        <label class="maaned">
          <span class="skjult">Måned</span>
          <input id="maaned" type="range" min="1" max="12.9" step="0.1" value="1" aria-valuetext="januar">
          <span class="maanedsakse" aria-hidden="true"><b data-k="J">jan</b><b data-k="F">feb</b><b data-k="M">mar</b><b data-k="A">apr</b><b data-k="M">maj</b><b data-k="J">jun</b><b data-k="J">jul</b><b data-k="A">aug</b><b data-k="S">sep</b><b data-k="O">okt</b><b data-k="N">nov</b><b data-k="D">dec</b></span>
        </label>
        <output id="maanedsnavn" for="maaned">januar</output>
      </div>
      <div class="kontakter">
        <button id="rotation" class="kontakt" aria-pressed="true"><span class="vippe" aria-hidden="true"></span>Jorden drejer</button>
        <button id="kontinenter" class="kontakt" aria-pressed="false"><span class="vippe" aria-hidden="true"></span>Kontinenter</button>
        <button id="etiketter" class="kontakt" aria-pressed="true"><span class="vippe" aria-hidden="true"></span>Navne</button>
      </div>
      <div class="handlinger">
        <button id="ballon" class="ballon" aria-pressed="false">Slip en ballon</button>
        <button id="pause" aria-pressed="false">❚❚ <span>Pause</span></button>
        <button id="fokus" aria-pressed="false" title="Skjul sidehovedet" aria-label="Fokus: skjul sidehovedet">⤢</button>
      </div>
    </div>
  </main>
  <p class="skjult" id="meddelelse" aria-live="polite"></p>
  <noscript><p>Modellen kræver JavaScript. Solvarme får luften til at stige ved ITK og synke ved 30°. Jordens rotation afbøjer vindene, så der opstår passat, vestenvind og polar østenvind.</p></noscript>
</body>
</html>
