<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img" aria-label="To cylinderglas sat sammen: med saltvandet nederst bliver lagene liggende, med saltvandet øverst vælter vandet rundt og blander sig">
  <title>Lagdelingsforsøget, Del 5</title>
  <desc>Til venstre står det farvede saltvand i det nederste glas og ferskvandet i det øverste; efter pladen er trukket ud, bliver lagene liggende. Til højre står saltvandet øverst; her vælter vandet rundt, og de to væsker blander sig til én farve.</desc>
  <g>
    <text x="70" y="24" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#26332B">A · Saltvandet nederst</text>
    <rect x="96" y="38" width="96" height="86" fill="#F4F8F9" stroke="#26332B" stroke-width="2"/>
    <rect x="96" y="128" width="96" height="86" fill="#8FBBD0" stroke="#26332B" stroke-width="2"/>
    <path d="M90 126 H198" stroke="#26332B" stroke-width="1.6" stroke-dasharray="5 4"/>
    <path d="M90 38 H198 M90 214 H198" stroke="#26332B" stroke-width="2.6" stroke-linecap="round"/>
    <text x="204" y="74" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" fill="#26332B">ferskvand</text>
    <text x="204" y="176" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" fill="#26332B">farvet saltvand</text>
    <text x="204" y="122" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6B7A66">pladen trukket ud</text>
    <text x="40" y="240" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#26332B">Lagene bliver liggende</text>
    <text x="40" y="256" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7A66">— stabil lagdeling, intet udveksles på tværs</text>
  </g>
  <g>
    <text x="400" y="24" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#26332B">B · Saltvandet øverst</text>
    <rect x="426" y="38" width="96" height="176" fill="#BFD8E4" stroke="#26332B" stroke-width="2"/>
    <path d="M420 126 H528" stroke="#26332B" stroke-width="1.6" stroke-dasharray="5 4"/>
    <path d="M420 38 H528 M420 214 H528" stroke="#26332B" stroke-width="2.6" stroke-linecap="round"/>
    <g fill="none" stroke="#1F5F8B" stroke-width="3.4" stroke-linecap="round">
      <path d="M444 66 C466 82 448 100 470 114"/>
      <path d="M486 56 C506 74 486 96 508 110"/>
      <path d="M440 146 C462 162 444 180 466 194"/>
      <path d="M488 140 C508 158 488 178 510 192"/>
    </g>
    <text x="534" y="122" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6B7A66">pladen trukket ud</text>
    <text x="370" y="240" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#26332B">Vandet vælter rundt og blander sig</text>
    <text x="370" y="256" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7A66">— ustabil lagdeling, det tunge vand synker ned</text>
  </g>
</svg>
