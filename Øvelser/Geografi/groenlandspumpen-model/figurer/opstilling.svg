  <rect x="522" y="95" width="18" height="10" rx="2" fill="#E3DFD2" stroke="#26332B" stroke-width="1.6"/>
  <text x="66" y="22" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#26332B">knust is + blå frugtfarve</text>
  <path d="M112 26 C112 40 112 50 112 62" stroke="#26332B" stroke-width="1.2" fill="none"/>
