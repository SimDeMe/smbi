    <rect x="106" y="96" width="20" height="17" rx="3"/>
    <rect x="74" y="116" width="20" height="17" rx="3"/>
  </g>
  <g fill="#1F5F8B"><circle cx="84" cy="64" r="3.6"/><circle cx="112" cy="70" r="3.6"/><circle cx="138" cy="64" r="3.6"/></g>
