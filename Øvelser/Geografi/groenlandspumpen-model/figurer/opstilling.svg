<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" height="236" role="img" aria-label="Forsøgsopstillingen til Del 3: plexiglaskar med skrå isholderplade, knust is med blå frugtfarve i den ene ende og en flaske med varmt vand i den anden">
  <title>Opstillingen til Del 3</title>
  <desc>Et gennemsigtigt kar fyldt med lunkent vand. I venstre ende sidder isholderpladen skråt med udskæringen nedad, og på den ligger knust is med blå frugtfarve. I højre ende står en lukket flaske med varmt vand.</desc>
