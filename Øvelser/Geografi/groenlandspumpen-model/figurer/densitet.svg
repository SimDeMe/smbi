<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" role="img" aria-label="To bægerglas: koldt vand lægger sig under varmt vand, og salt vand lægger sig under ferskvand">
  <title>De to ting, der gør vand tungt</title>
  <desc>Venstre bægerglas viser et koldt lag nederst og et varmt lag øverst med en pil nedad. Højre bægerglas viser et salt lag nederst og et ferskt lag øverst med en pil nedad.</desc>
  <g>
    <rect x="34" y="16" width="170" height="112" rx="4" fill="#FFFFFF" stroke="#26332B" stroke-width="2"/>
    <rect x="36" y="18" width="166" height="52" fill="#F6E2DC"/>
    <rect x="36" y="70" width="166" height="56" fill="#D9E9F0"/>
    <path d="M36 70 H202" stroke="#26332B" stroke-width="1.2"/>
    <text x="48" y="48" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="14" fill="#26332B">varmt vand</text>
    <text x="48" y="102" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="14" fill="#26332B">koldt vand</text>
    <path d="M172 82 V104" stroke="#1F5F8B" stroke-width="6" stroke-linecap="round"/>
    <path d="M162 98 L172 112 L182 98" fill="none" stroke="#1F5F8B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="156" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#26332B">Koldt vand er tungest</text>
    <text x="34" y="172" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7A66">— molekylerne sidder tættere</text>
  </g>
  <g>
    <rect x="370" y="16" width="170" height="112" rx="4" fill="#FFFFFF" stroke="#26332B" stroke-width="2"/>
    <rect x="372" y="18" width="166" height="50" fill="#FFFFFF"/>
    <rect x="372" y="68" width="166" height="58" fill="#B6D4E2"/>
    <path d="M372 68 H538" stroke="#26332B" stroke-width="1.2"/>
    <g fill="#1F5F8B"><circle cx="402" cy="38" r="3.4"/><circle cx="430" cy="30" r="3.4"/><circle cx="458" cy="42" r="3.4"/><circle cx="488" cy="32" r="3.4"/></g>
    <text x="384" y="60" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="14" fill="#26332B">ferskvand</text>
    <text x="384" y="102" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="14" fill="#26332B">salt vand</text>
    <path d="M508 80 V102" stroke="#1F5F8B" stroke-width="6" stroke-linecap="round"/>
    <path d="M498 96 L508 110 L518 96" fill="none" stroke="#1F5F8B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="370" y="156" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#26332B">Salt vand er tungest</text>
    <text x="370" y="172" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7A66">— saltet lægger masse til uden at fylde meget</text>
  </g>
</svg>
