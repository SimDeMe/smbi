<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" aria-label="Opstillingen i to trin: karret løftes i den ene ende, og når det sættes ned, løber en bølge frem og tilbage mellem enderne, mens man tager tid på fem banelængder">
  <title>Opstillingen: bedroller med vand, der løftes og sættes ned</title>
  <desc>Øverst står karret med den venstre ende A løftet ca. 5 cm på en klods. Vandoverfladen er stadig vandret, så vandet er dybest i den højre ende B og lavest i ende A. Nederst er karret sat ned igen. En bølge starter i ende B og løber mod A, bliver kastet tilbage, og sådan fortsætter den. Karrets længde L er én banelængde, og vanddybden d måles med tommestokken. Fem pile viser de fem banelængder, man tager tid på: B til A, A til B, B til A, A til B og B til A.</desc>
  <defs>
    <marker id="o-pil" viewBox="0 0 12 12" refX="7" refY="6" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#26332B"/></marker>
    <marker id="o-bpil" viewBox="0 0 12 12" refX="7" refY="6" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#1F5F8B"/></marker>
    <marker id="o-rpil" viewBox="0 0 12 12" refX="7" refY="6" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#A8402C"/></marker>
  </defs>
  <text x="20" y="22" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#26332B">1 · Løft ende A ca. 5 cm, og vent, til vandet står stille</text>
