  <text x="430" y="161" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="11" fill="#26332B">vand</text>
  <path d="M462 66 Q463 150.0 470 186 Q477 150.0 478 66 Z" fill="#E8C75A" stroke="#26332B" stroke-width="1"/>
  <text x="470" y="202" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="11" fill="#26332B" text-anchor="middle">olie</text>
  <path d="M514 66 Q515 122.0 522 146 Q529 122.0 530 66 Z" fill="#8FC98A" stroke="#26332B" stroke-width="1"/>
