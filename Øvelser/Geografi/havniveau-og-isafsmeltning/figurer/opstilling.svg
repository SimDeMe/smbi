<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="To ens kar under en lampe. I kar A ligger isterningerne tørt oven på murstenene, i kar B flyder de på vandet">
  <title>Opstillingen: is på land og is i havet</title>
  <desc>To gennemsigtige kar står ved siden af hinanden under en lampe. I begge kar står to mursten som et kontinent, og vandet står lige højt. I kar A ligger isterningerne oven på murstenene, over vandspejlet, som en gletsjer på land. I kar B flyder isterningerne på vandet ved siden af murstenene som havis. En lineal er sat op ad hver kars væg, så vandstanden kan aflæses.</desc>
