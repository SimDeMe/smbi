<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-label="Vægten nulstilles med skålen på, og derefter hænges stenen i snor ned i vandet, så vægten viser massen af det fortrængte vand">
  <title>Opstillingen: vægt, vandskål og sten i snor</title>
  <desc>Til venstre står en skål med vand på vægten, som viser 0 g efter nulstilling. Til højre hænger en sten i en snor helt nede i vandet uden at røre bunden. Vandet løfter stenen med en opdrift, stenen trykker tilsvarende ned på vandet, og vægten viser nu et positivt tal: massen af det vand, stenen fortrænger.</desc>
  <defs>
    <marker id="o-pil" viewBox="0 0 12 12" refX="7" refY="6" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#1F5F8B"/></marker>
    <marker id="o-pil2" viewBox="0 0 12 12" refX="7" refY="6" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#A8402C"/></marker>
  </defs>
  <text x="20" y="22" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#26332B">1 · Skål med vand på vægten — tryk TARE</text>
  <path d="M84 132 L236 132 L219 190 L101 190 Z" fill="#C3DAE6"/>
  <path d="M78 110 L242 110 L222 194 L98 194 Z" fill="none" stroke="#26332B" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="50" y="196" width="220" height="36" rx="6" fill="#EDEFEA" stroke="#26332B" stroke-width="2"/>
  <rect x="126" y="205" width="68" height="19" rx="3" fill="#26332B"/>
  <text x="160" y="219" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#D6F2C4" text-anchor="middle">0 g</text>
  <text x="160" y="254" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7A66" text-anchor="middle">skål og vand tæller nu ikke med</text>

  <text x="340" y="22" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#26332B">2 · Stenen hænger frit i vandet</text>
  <path d="M414 126 L566 126 L549 190 L431 190 Z" fill="#C3DAE6"/>
  <path d="M414 126 L566 126" stroke="#7FA8BC" stroke-width="1.4"/>
  <path d="M490 36 V142" stroke="#8A6D3B" stroke-width="2"/>
  <path d="M466 150 L478 139 L500 137 L515 147 L512 164 L494 171 L472 167 Z" fill="#9A9C97" stroke="#26332B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M408 110 L572 110 L552 194 L428 194 Z" fill="none" stroke="#26332B" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M448 172 V146" stroke="#1F5F8B" stroke-width="3" marker-end="url(#o-pil)"/>
  <text x="410" y="164" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#1F5F8B" text-anchor="end">opdrift</text>
  <path d="M532 150 V176" stroke="#A8402C" stroke-width="3" marker-end="url(#o-pil2)"/>
  <text x="568" y="160" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#A8402C">modkraft</text>
  <path d="M494 174 V188" stroke="#26332B" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="566" y="190" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6B7A66">fri af bunden</text>
  <path d="M562 186 L500 182" stroke="#6B7A66" stroke-width="1"/>
  <text x="498" y="48" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7A66">hold i snoren</text>
  <rect x="380" y="196" width="220" height="36" rx="6" fill="#EDEFEA" stroke="#26332B" stroke-width="2"/>
  <rect x="456" y="205" width="68" height="19" rx="3" fill="#26332B"/>
  <text x="490" y="219" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#D6F2C4" text-anchor="middle">148 g</text>
  <text x="490" y="254" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7A66" text-anchor="middle">tallet = massen af det fortrængte vand</text>
</svg>
