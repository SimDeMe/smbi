<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="En lampe lyser ned på et papir med fem felter i gråtonerne 0, 25, 50, 75 og 100 procent, der ligger på en flamingoplade. Temperaturen måles med et IR-termometer">
  <title>Opstillingen: gråtoneark under lampe</title>
  <desc>Papiret med fem gråtonefelter ligger på en flamingoplade. Feltet til venstre er hvidt (0 %), feltet til højre er sort (100 %), og imellem ligger 25, 50 og 75 % grå. En lampe hænger over midten af papiret i fast afstand og vinkel. Et IR-termometer peger på ét felt ad gangen.</desc>
  <path d="M320 0 V30" stroke="#26332B" stroke-width="2"/>
  <path d="M282 58 L302 30 H338 L358 58 Z" fill="#E6E2D6" stroke="#26332B" stroke-width="2" stroke-linejoin="round"/>
  <path d="M90 170 L284 60 H356 L550 170 Z" fill="#FFE9A8" opacity="0.5"/>
  <text x="368" y="28" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7A66">lampe — samme afstand og vinkel hele tiden</text>
  <path d="M590 60 V168" stroke="#6B7A66" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="598" y="118" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="11" fill="#6B7A66">fast</text>
  <text x="598" y="132" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="11" fill="#6B7A66">afstand</text>
  <rect x="70" y="190" width="500" height="26" fill="#F2F4F1" stroke="#26332B" stroke-width="1.8"/>
  <text x="320" y="234" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="11" fill="#6B7A66" text-anchor="middle">flamingoplade</text>
  <rect x="90" y="170" width="84" height="20" fill="#FFFFFF" stroke="#26332B" stroke-width="1.4"/>
  <text x="132" y="160" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#26332B" text-anchor="middle">0 %</text>
  <rect x="184" y="170" width="84" height="20" fill="#BFBFBF" stroke="#26332B" stroke-width="1.4"/>
  <text x="226" y="160" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#26332B" text-anchor="middle">25 %</text>
  <rect x="278" y="170" width="84" height="20" fill="#808080" stroke="#26332B" stroke-width="1.4"/>
  <text x="320" y="160" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#26332B" text-anchor="middle">50 %</text>
  <rect x="372" y="170" width="84" height="20" fill="#404040" stroke="#26332B" stroke-width="1.4"/>
  <text x="414" y="160" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#26332B" text-anchor="middle">75 %</text>
  <rect x="466" y="170" width="84" height="20" fill="#000000" stroke="#26332B" stroke-width="1.4"/>
  <text x="508" y="160" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#26332B" text-anchor="middle">100 %</text>
  <path d="M28 96 L66 116 L60 128 L22 108 Z" fill="#E7F4FB" stroke="#26332B" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M34 112 L28 140 H40 L46 118" fill="#E7F4FB" stroke="#26332B" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M66 122 L128 168" stroke="#A8402C" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="20" y="86" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="12" fill="#6B7A66">IR-termometer</text>
  <text x="20" y="256" font-family="Carlito,Calibri,Helvetica,Arial,sans-serif" font-size="10" fill="#6B7A66">skitse — ikke målfast</text>
</svg>
