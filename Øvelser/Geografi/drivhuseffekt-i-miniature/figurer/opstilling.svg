<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="To billeder af opstillingen: lampen og termometeret uden viskestykke, og den samme opstilling dækket af et viskestykke">
  <title>Opstillingen: lampe, termometer og viskestykke</title>
  <desc>Til venstre ligger en arkitektlampe ned på bordet med skærmen vendt mod et termometer, der ligger lige foran pæren. Til højre er den samme opstilling dækket af et viskestykke, så både lampen og termometeret er under stoffet. Termometeret må ikke flyttes i løbet af forsøget.</desc>
